<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 48" width="220" height="48">
  <defs>
    <linearGradient id="emeraldGlassGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399"/>
      <stop offset="45%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
    <linearGradient id="sparkWhiteGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="70%" stop-color="#E6FFFA"/>
      <stop offset="100%" stop-color="#A7F3D0"/>
    </linearGradient>
    <filter id="glowEffect" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.2" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Glass Container Badge -->
  <rect x="4" y="4" width="40" height="40" rx="12" fill="url(#emeraldGlassGrad)" stroke="rgba(255,255,255,0.4)" stroke-width="1.2"/>
  
  <!-- Subtle Glass Highlight Arc -->
  <path d="M7 16 Q 24 6 41 16" stroke="rgba(255,255,255,0.45)" stroke-width="1" fill="none" stroke-linecap="round"/>

  <!-- Primary 8-Pointed Diamond Spark -->
  <path d="M24 10 L27.5 20.5 L38 24 L27.5 27.5 L24 38 L20.5 27.5 L10 24 L20.5 20.5 Z" fill="url(#sparkWhiteGrad)" filter="url(#glowEffect)"/>

  <!-- Secondary "Second Spark" Satellite Star -->
  <path d="M33 13 L35 16.8 L39 18 L35 19.2 L33 23 L31 19.2 L27 18 L31 16.8 Z" fill="#FFFFFF" opacity="0.95"/>

  <!-- Quantum Nucleus Spark Core -->
  <circle cx="24" cy="24" r="2.8" fill="#FFFFFF"/>

  <!-- Wordmark -->
  <text x="54" y="31" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="21" font-weight="800" fill="#111827" letter-spacing="-0.03em">Second<tspan fill="#10B981">Spark</tspan></text>
</svg>
