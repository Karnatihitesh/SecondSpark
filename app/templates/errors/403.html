{% extends 'base.html' %}

{% block title %}Access Denied — 403 Forbidden{% endblock %}

{% block content %}
<div class="container" style="padding: 6rem 1.5rem; text-align: center;">
  <div style="font-size: 5rem; font-weight: 800; color: #EF4444; line-height: 1; margin-bottom: 1rem;">403</div>
  <h1 style="font-size: 2rem; margin-bottom: 1rem;">Access Forbidden</h1>
  <p style="color: var(--text-muted); max-width: 500px; margin: 0 auto 2rem; font-size: 1.05rem;">
    You do not have the required permissions to access this administrative portal or resource.
  </p>
  <a href="{{ url_for('main.index') }}" class="btn btn-primary btn-lg">Return to Home</a>
</div>
{% endblock %}
