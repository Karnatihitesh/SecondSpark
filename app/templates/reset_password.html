{% extends 'base.html' %}
{% block title %}Reset Password — SecondSpark{% endblock %}

{% block content %}
<div class="container" style="padding:5rem 1.5rem;display:flex;justify-content:center;align-items:center;min-height:70vh;">
  <div class="glass-card" style="max-width:460px;width:100%;padding:2.75rem;background:#fff;border-radius:20px;box-shadow:0 20px 60px rgba(0,0,0,0.08);">

    <div style="text-align:center;margin-bottom:2rem;">
      <div style="width:56px;height:56px;background:linear-gradient(135deg,#10B981,#065F46);border-radius:14px;display:flex;align-items:center;justify-content:center;margin:0 auto 1.25rem;box-shadow:0 6px 18px rgba(16,185,129,0.25);">
        <i class="fa-solid fa-lock-open" style="color:#fff;font-size:1.4rem;"></i>
      </div>
      <h1 style="font-size:1.75rem;margin-bottom:0.4rem;">Set New Password</h1>
      <p style="color:var(--text-muted);font-size:0.92rem;">Create a strong password for your account.</p>
    </div>

    <form action="{{ url_for('auth.reset_password') }}" method="POST">
      <input type="hidden" name="email" value="{{ email }}">
      <input type="hidden" name="token" value="{{ token }}">

      <div class="form-group" style="margin-bottom:1.25rem;">
        <label class="form-label">New Password</label>
        <div style="position:relative;">
          <i class="fa-solid fa-lock" style="position:absolute;left:1rem;top:50%;transform:translateY(-50%);color:var(--text-light);font-size:0.9rem;"></i>
          <input type="password" name="new_password" id="pw1" class="form-control" placeholder="At least 8 characters" style="padding-left:2.75rem;" required minlength="8">
          <button type="button" onclick="togglePw('pw1','eye1')" style="position:absolute;right:1rem;top:50%;transform:translateY(-50%);background:none;border:none;color:var(--text-light);cursor:pointer;">
            <i class="fa-regular fa-eye" id="eye1"></i>
          </button>
        </div>
        <!-- Strength bar -->
        <div style="height:4px;background:var(--border-subtle);border-radius:4px;margin-top:0.5rem;overflow:hidden;">
          <div id="strength-bar" style="height:100%;width:0%;background:var(--danger);border-radius:4px;transition:all 0.35s;"></div>
        </div>
        <div id="strength-label" style="font-size:0.78rem;color:var(--text-light);margin-top:0.25rem;"></div>
      </div>

      <div class="form-group" style="margin-bottom:1.75rem;">
        <label class="form-label">Confirm Password</label>
        <div style="position:relative;">
          <i class="fa-solid fa-lock" style="position:absolute;left:1rem;top:50%;transform:translateY(-50%);color:var(--text-light);font-size:0.9rem;"></i>
          <input type="password" name="confirm_password" id="pw2" class="form-control" placeholder="Repeat password" style="padding-left:2.75rem;" required>
          <button type="button" onclick="togglePw('pw2','eye2')" style="position:absolute;right:1rem;top:50%;transform:translateY(-50%);background:none;border:none;color:var(--text-light);cursor:pointer;">
            <i class="fa-regular fa-eye" id="eye2"></i>
          </button>
        </div>
        <div id="match-msg" style="font-size:0.78rem;margin-top:0.25rem;"></div>
      </div>

      <button type="submit" class="btn btn-primary btn-block btn-lg">
        <i class="fa-solid fa-shield-check"></i> Update Password
      </button>
    </form>

  </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
function togglePw(id, eyeId) {
  const el = document.getElementById(id);
  const eye = document.getElementById(eyeId);
  if (el.type === 'password') { el.type = 'text'; eye.className = 'fa-regular fa-eye-slash'; }
  else { el.type = 'password'; eye.className = 'fa-regular fa-eye'; }
}

const pw1 = document.getElementById('pw1');
const pw2 = document.getElementById('pw2');
const bar = document.getElementById('strength-bar');
const lbl = document.getElementById('strength-label');
const matchMsg = document.getElementById('match-msg');

pw1.addEventListener('input', () => {
  const val = pw1.value;
  let score = 0;
  if (val.length >= 8)  score++;
  if (/[A-Z]/.test(val)) score++;
  if (/[0-9]/.test(val)) score++;
  if (/[^A-Za-z0-9]/.test(val)) score++;
  const levels = ['','Weak','Fair','Good','Strong'];
  const colors = ['','#EF4444','#F59E0B','#3B82F6','#10B981'];
  bar.style.width  = (score * 25) + '%';
  bar.style.background = colors[score] || 'var(--danger)';
  lbl.textContent  = levels[score] || '';
  lbl.style.color  = colors[score] || 'var(--text-light)';
});

pw2.addEventListener('input', () => {
  if (!pw2.value) { matchMsg.textContent = ''; return; }
  if (pw2.value === pw1.value) {
    matchMsg.textContent = '✓ Passwords match';
    matchMsg.style.color = '#10B981';
  } else {
    matchMsg.textContent = '✗ Passwords do not match';
    matchMsg.style.color = 'var(--danger)';
  }
});
</script>
{% endblock %}
