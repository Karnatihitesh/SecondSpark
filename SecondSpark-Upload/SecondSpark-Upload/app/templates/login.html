{% extends 'base.html' %}

{% block title %}Log In — SecondSpark{% endblock %}

{% block content %}
<div class="container" style="padding: 4rem 1.5rem; display: flex; justify-content: center; align-items: center; min-height: 75vh;">
  <div class="glass-card" style="max-width: 440px; width: 100%; padding: 2.75rem; background: #fff; border-radius: 20px; box-shadow: 0 20px 60px rgba(0,0,0,0.08);">

    <div style="text-align: center; margin-bottom: 2rem;">
      <span class="brand-icon" style="margin: 0 auto 1rem; width: 48px; height: 48px; font-size: 1.4rem;"><i class="fa-solid fa-bolt"></i></span>
      <h1 style="font-size: 1.8rem; margin-bottom: 0.35rem;">Welcome Back</h1>
      <p style="color: var(--text-muted); font-size: 0.92rem;">Log in to manage your builds and collaborations</p>
    </div>

    <!-- Google Sign In Button -->
    <a href="{{ url_for('auth.google_login') }}" class="btn btn-block" style="background: #FFFFFF; border: 1.5px solid var(--border-subtle); color: var(--dark-800); font-weight: 600; display: flex; align-items: center; justify-content: center; gap: 0.75rem; height: 48px; border-radius: var(--radius-md); box-shadow: 0 2px 6px rgba(0,0,0,0.04); text-decoration: none; transition: all 0.2s; margin-bottom: 1.25rem;" onmouseover="this.style.borderColor='var(--dark-400)';this.style.background='#F9FAFB'" onmouseout="this.style.borderColor='var(--border-subtle)';this.style.background='#FFFFFF'">
      <svg width="18" height="18" viewBox="0 0 18 18">
        <path fill="#4285F4" d="M17.64 9.2c0-.637-.057-1.251-.164-1.84H9v3.481h4.844c-.209 1.125-.843 2.078-1.796 2.717v2.258h2.908c1.702-1.567 2.684-3.874 2.684-6.616z"/>
        <path fill="#34A853" d="M9 18c2.43 0 4.467-.806 5.956-2.184l-2.908-2.258c-.806.54-1.837.86-3.048.86-2.344 0-4.328-1.584-5.036-3.711H.957v2.332C2.438 15.983 5.482 18 9 18z"/>
        <path fill="#FBBC05" d="M3.964 10.707c-.18-.54-.282-1.117-.282-1.707s.102-1.167.282-1.707V4.961H.957C.347 6.175 0 7.55 0 9s.347 2.825.957 4.039l3.007-2.332z"/>
        <path fill="#EA4335" d="M9 3.58c1.321 0 2.508.454 3.44 1.345l2.582-2.58C13.463.891 11.426 0 9 0 5.482 0 2.438 2.017.957 4.961L3.964 7.293C4.672 5.166 6.656 3.58 9 3.58z"/>
      </svg>
      Sign in with Google
    </a>

    <!-- Divider -->
    <div style="display: flex; align-items: center; margin-bottom: 1.5rem; color: var(--text-muted); font-size: 0.82rem;">
      <div style="flex: 1; height: 1px; background: var(--border-subtle);"></div>
      <span style="padding: 0 0.85rem; font-weight: 600; letter-spacing: 0.05em;">OR WITH EMAIL</span>
      <div style="flex: 1; height: 1px; background: var(--border-subtle);"></div>
    </div>

    <form action="{{ url_for('auth.login', next=request.args.get('next', '')) }}" method="POST">

      <div class="form-group">
        <label class="form-label">Email or Username</label>
        <input type="text" name="login_input" class="form-control" placeholder="username or email@domain.com" required autofocus />
      </div>

      <div class="form-group">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.4rem;">
          <label class="form-label" style="margin-bottom: 0;">Password</label>
          <a href="{{ url_for('auth.forgot_password') }}" style="font-size: 0.82rem; color: var(--primary); font-weight: 600;">Forgot password?</a>
        </div>
        <input type="password" name="password" class="form-control" placeholder="••••••••" required />
      </div>

      <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 1.5rem; font-size: 0.85rem;">
        <label style="display: flex; align-items: center; gap: 0.5rem; cursor: pointer; color: var(--dark-700);">
          <input type="checkbox" name="remember" style="accent-color: var(--primary);" /> Keep me signed in
        </label>
      </div>

      <button type="submit" class="btn btn-primary btn-block btn-lg">Log In</button>

      <div style="text-align: center; margin-top: 1.75rem; font-size: 0.9rem; color: var(--text-muted);">
        Don't have an account? <a href="{{ url_for('auth.register') }}" style="color: var(--primary); font-weight: 600;">Sign up free</a>
      </div>

    </form>
  </div>
</div>
{% endblock %}
