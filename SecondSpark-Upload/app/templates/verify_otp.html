{% extends 'base.html' %}
{% block title %}Verify OTP — SecondSpark{% endblock %}

{% block content %}
<div class="container" style="padding: 5rem 1.5rem; display:flex; justify-content:center; align-items:center; min-height:70vh;">
  <div class="glass-card" style="max-width:460px;width:100%;padding:2.75rem;background:#fff;border-radius:20px;box-shadow:0 20px 60px rgba(0,0,0,0.08);">

    <div style="text-align:center;margin-bottom:2rem;">
      <div style="width:56px;height:56px;background:linear-gradient(135deg,#3B82F6,#1D4ED8);border-radius:14px;display:flex;align-items:center;justify-content:center;margin:0 auto 1.25rem;box-shadow:0 6px 18px rgba(59,130,246,0.25);">
        <i class="fa-solid fa-message" style="color:#fff;font-size:1.4rem;"></i>
      </div>
      <h1 style="font-size:1.75rem;margin-bottom:0.4rem;">Enter Your Code</h1>
      <p style="color:var(--text-muted);font-size:0.92rem;line-height:1.6;">
        We sent a 6-digit code to <strong style="color:var(--dark-900);">{{ email }}</strong>.<br>
        It expires in <span id="otp-timer" style="color:var(--primary);font-weight:700;">10:00</span>.
      </p>
    </div>

    <form action="{{ url_for('auth.verify_otp') }}" method="POST">
      <input type="hidden" name="email" value="{{ email }}">

      <!-- 6-box OTP input -->
      <div style="display:flex;gap:0.65rem;justify-content:center;margin-bottom:1.75rem;" id="otp-boxes">
        {% for i in range(6) %}
        <input
          type="text"
          maxlength="1"
          inputmode="numeric"
          pattern="[0-9]"
          class="otp-digit"
          style="width:50px;height:58px;text-align:center;font-size:1.5rem;font-weight:700;border:2px solid var(--border-subtle);border-radius:12px;transition:all 0.2s;outline:none;background:#F8FAF9;"
          autocomplete="off"
          id="otp-{{ i }}"
        />
        {% endfor %}
      </div>
      <input type="hidden" name="otp_code" id="otp-hidden">

      <button type="submit" class="btn btn-primary btn-block btn-lg" id="verify-btn">
        <i class="fa-solid fa-check-double"></i> Verify & Continue
      </button>
    </form>

    <div style="text-align:center;margin-top:1.5rem;font-size:0.88rem;">
      <span style="color:var(--text-muted);">Didn't receive it?</span>
      <a href="{{ url_for('auth.forgot_password') }}" style="color:var(--primary);font-weight:600;margin-left:0.35rem;">Resend Code</a>
    </div>

  </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
// Auto-focus next box & assemble hidden value
const digits = document.querySelectorAll('.otp-digit');
const hidden  = document.getElementById('otp-hidden');

digits.forEach((box, i) => {
  box.addEventListener('input', e => {
    e.target.value = e.target.value.replace(/[^0-9]/g,'');
    if (e.target.value && i < 5) digits[i+1].focus();
    assemble();
    styleActive(i);
  });
  box.addEventListener('keydown', e => {
    if (e.key === 'Backspace' && !e.target.value && i > 0) {
      digits[i-1].focus();
    }
  });
  box.addEventListener('focus', () => {
    box.style.borderColor = 'var(--primary)';
    box.style.background  = 'var(--primary-light)';
    box.style.boxShadow   = '0 0 0 3px var(--primary-glow)';
  });
  box.addEventListener('blur', () => {
    box.style.borderColor = box.value ? 'var(--primary-dark)' : 'var(--border-subtle)';
    box.style.background  = '#F8FAF9';
    box.style.boxShadow   = 'none';
  });
});

function styleActive(i) {
  digits[i].style.borderColor = 'var(--primary-dark)';
}
function assemble() {
  hidden.value = Array.from(digits).map(d => d.value).join('');
}

// Paste support — distribute across boxes
document.getElementById('otp-boxes').addEventListener('paste', e => {
  e.preventDefault();
  const pasted = (e.clipboardData.getData('text') || '').replace(/\D/g,'').slice(0,6);
  pasted.split('').forEach((ch, i) => { if(digits[i]) digits[i].value = ch; });
  assemble();
  const next = Math.min(pasted.length, 5);
  digits[next].focus();
});

// Countdown timer
let seconds = 600;
const timerEl = document.getElementById('otp-timer');
const tick = setInterval(() => {
  if (--seconds <= 0) { clearInterval(tick); timerEl.textContent = 'Expired'; timerEl.style.color='var(--danger)'; return; }
  const m = String(Math.floor(seconds/60)).padStart(2,'0');
  const s = String(seconds % 60).padStart(2,'0');
  timerEl.textContent = `${m}:${s}`;
}, 1000);

// Auto-focus first box
digits[0].focus();
</script>
{% endblock %}
